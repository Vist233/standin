# The version 1 box. Everything is named ogb-* so it is easy to find and remove by exact name.
#   docker compose -f image/compose.yaml up -d --build
# Ports are bound to 127.0.0.1 only: the page is at http://127.0.0.1:8787/ and has no login (owner decision 11).
# The model key is passed through from the shell that runs compose and is never written to a file:
#   COMMANDCODE_API_KEY=... docker compose -f image/compose.yaml up -d
name: ogb
services:
  box:
    image: ogb-box:dev
    container_name: ogb-box
    build:
      context: ..
      dockerfile: image/Dockerfile
    restart: unless-stopped
    cpus: 4
    mem_limit: 8g # the owner, 2026-11-15: 4 GB left no room for 8 desktops plus a test browser
    memswap_limit: 8g
    pids_limit: 4096
    shm_size: 1gb # Chromium keeps shared memory in /dev/shm; the default 64 MB is too small for several windows
    security_opt:
      - no-new-privileges:true
    environment:
      - COMMANDCODE_API_KEY # no value here: compose copies it from the environment of the command
      - OGB_RUN_TURNS
      - OGB_RUN_TOKENS
      - OGB_RUN_SECONDS
      - OGB_TELEGRAM_TOKEN # the Telegram channel: the bot's token (a secret, taken out of the environment at start) ...
      - OGB_TELEGRAM_CHAT # ... and the person's chat id; both set turns the channel on
      - OGB_TEMP_MAIL_URL # real mail (docs/25): the cloudflare_temp_email deployment's API address ...
      - OGB_TEMP_MAIL_DOMAIN # ... its domain; both set give every bot its own address
      - OGB_TEMP_MAIL_ADMIN # the deployment's admin password (a secret, taken out of the environment at start)
      - OGB_TEMP_MAIL_SITE_PASSWORD # the deployment's site password, when it has one (a secret)
      - OGB_MAIL_TO # the person's own address: the mail channel writes there from vesper@<domain>
      - OGB_OUTLOOK_CLIENT_ID # the person's Outlook: the owner's app registration (public client); one bot holds the account
      - OGB_OUTLOOK_TENANT # consumers (Outlook.com), organizations, or a tenant id; default common
      - OGB_GMAIL_ADDRESS # the person's Gmail (IMAP and SMTP); one bot holds it after the person approves gmail_connect ...
      - OGB_GMAIL_APP_PASSWORD # ... with an app password (a secret, taken out of the environment at start)
      - OGB_HOOK_RELAY_URL # webhooks from outside: the hook relay's https address (relay/hook-relay, deployed apart) ...
      - OGB_HOOK_RELAY_KEY # ... and its key (a secret, taken out of the environment at start)
      - TZ # the person's time zone for scheduled 'daily HH:MM' jobs (for example Asia/Singapore); unset is UTC
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ogb-data:/data
    networks:
      - ogb-net
volumes:
  ogb-data:
    name: ogb-data
networks:
  ogb-net:
    name: ogb-net
